<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정보처리기사 실기 개념서 &amp; 기출 해설 (2020~2026)</title>
  
  <!-- Preload LG EI Web Fonts -->
  <link rel="preload" href="fonts/LGEIText-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/LGEIHeadline-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       CSS Variables & Global Reset (Company Test 미니멀 CBT 테마 1:1 일치)
       ========================================================================== */
    @font-face {
      font-family: 'LG EI Headline';
      src: url('fonts/LGEIHeadline-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'LG EI Headline';
      src: url('fonts/LGEIHeadline-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'LG EI Text';
      src: url('fonts/LGEIText-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'LG EI Text';
      src: url('fonts/LGEIText-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'LG EI Text';
      src: url('fonts/LGEIText-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-headline: 'LG EI Headline', 'LG EI Text', 'Noto Sans KR', sans-serif;
      --font-body: 'LG EI Text', 'Noto Sans KR', sans-serif;
      --font-code: 'JetBrains Mono', Consolas, 'Courier New', monospace;

      --bg-page: #ffffff;
      --header-bg: #1e2024;
      --header-text: #ffffff;
      --text-main: #222222;
      --text-sub: #555555;
      --text-muted: #888888;
      --tool-bg: #f4f5f7;
      --border-color: #cbd5e1;
      --border-light: #e5e7eb;
      --current-border: #111827;
      --btn-dark: #262626;
      --btn-dark-hover: #3f3f46;
      --btn-tool: #374151;
      --btn-tool-hover: #4b5563;
      --btn-danger: #dc2626;
      --btn-danger-hover: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: 15px;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.72;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-headline);
    }

    em, i, cite, address, var {
      font-style: normal;
    }

    /* ==========================================================================
       Top Header Bar (52px, #1e2024, padding 0 40px - index.html 1:1)
       ========================================================================== */
    .study-header {
      font-family: var(--font-headline);
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      color: var(--header-text);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-bottom: 1px solid #2b2f36;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-logo {
      font-family: var(--font-headline);
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .header-logo-badge {
      background: var(--btn-danger);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 0;
    }

    .mode-toggle-group {
      display: flex;
      background: #2b2f36;
      padding: 2px;
      border-radius: 0;
      position: relative;
    }

    .btn-mode-tab {
      position: relative;
      background: none;
      border: none;
      color: #9ca3af;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.22s cubic-bezier(0.22, 1, 0.36, 1), color 0.22s cubic-bezier(0.22, 1, 0.36, 1), transform 0.18s ease;
      font-family: var(--font-headline);
    }

    .btn-mode-tab::after {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 2px;
      background: var(--btn-danger);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-mode-tab:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .btn-mode-tab.active {
      background: var(--btn-dark);
      color: #ffffff;
      font-weight: 700;
    }

    .btn-mode-tab.active::after {
      transform: scaleX(1);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: #2b2f36;
      border: 1px solid #4b5563;
      border-radius: 0;
      color: #ffffff;
      font-size: 12px;
      padding: 5px 10px 5px 28px;
      width: 240px;
      outline: none;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      font-family: var(--font-body);
    }

    .search-input:focus {
      border-color: #9ca3af;
      width: 280px;
      background: #1e2024;
    }

    .search-icon {
      position: absolute;
      left: 8px;
      font-size: 12px;
      color: #9ca3af;
      pointer-events: none;
    }

    .search-clear-btn {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 12px;
      display: none;
    }

    .btn-action-tool {
      background: var(--btn-tool);
      color: #e5e7eb;
      border: none;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.18s cubic-bezier(0.22, 1, 0.36, 1), color 0.18s ease, transform 0.18s ease;
    }

    .btn-action-tool:hover {
      background: var(--btn-tool-hover);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-action-cbt {
      background: var(--btn-danger);
      color: #ffffff;
      font-weight: 700;
    }

    .btn-action-cbt:hover {
      background: var(--btn-danger-hover);
    }

    /* ==========================================================================
       Main App Layout
       ========================================================================== */
    .app-layout {
      display: flex;
      min-height: calc(100vh - 52px);
    }

    /* ==========================================================================
       Sidebar Navigation (Company Test Tool Column Color: #f4f5f7)
       ========================================================================== */
    .sidebar {
      width: 300px;
      background: var(--tool-bg);
      color: var(--text-main);
      border-right: 1px solid var(--border-color);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 52px;
      height: calc(100vh - 52px);
      overflow-y: auto;
    }

    .sidebar-section-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #6b7280;
      padding: 14px 14px 6px 14px;
    }

    .sidebar-list {
      list-style: none;
      padding: 0 8px 12px 8px;
    }

    .sidebar-item-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #374151;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease;
      font-family: var(--font-body);
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .sidebar-item-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--current-border);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sidebar-item-label {
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sidebar-item-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .unit-chevron {
      display: inline-block;
      font-size: 11px;
      color: #9ca3af;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease;
      line-height: 1;
    }

    .sidebar-item-btn:hover {
      background: #f3f4f6;
      border-color: #cbd5e1;
    }

    .sidebar-item-btn:hover::before {
      transform: scaleY(0.6);
    }

    .sidebar-item-btn:hover .sidebar-item-label {
      transform: translateX(2px);
    }

    .sidebar-item-btn.active {
      background: var(--btn-dark);
      color: #ffffff;
      border-color: var(--btn-dark);
      font-weight: 700;
    }

    .sidebar-item-btn.active::before {
      background: var(--btn-danger);
      transform: scaleY(1);
    }

    .sidebar-item-btn.active .unit-chevron {
      transform: rotate(90deg);
      color: #ffffff;
    }

    .sidebar-badge {
      font-size: 11px;
      background: #f3f4f6;
      color: #6b7280;
      padding: 1px 6px;
      border-radius: 0;
      font-weight: 600;
      margin-left: 8px;
      white-space: nowrap;
      border: 1px solid #e5e7eb;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .sidebar-item-btn.active .sidebar-badge {
      background: #3f3f46;
      color: #f3f4f6;
      border-color: #52525b;
    }

    /* Smooth CSS Grid Accordion for Subtopics */
    .sidebar-subtopics-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
      overflow: hidden;
    }

    .sidebar-subtopics-wrapper.open {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .sidebar-subtopics-inner {
      min-height: 0;
      overflow: hidden;
    }

    .sidebar-subtopics {
      padding: 2px 0 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .subtopic-chip {
      position: relative;
      background: transparent;
      border: none;
      border-left: 3px solid transparent;
      text-align: left;
      color: #4b5563;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s cubic-bezier(0.22, 1, 0.36, 1), padding-left 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      font-family: var(--font-body);
    }

    .subtopic-chip:hover {
      color: #111827;
      background: rgba(0, 0, 0, 0.05);
      padding-left: 13px;
      border-left-color: #9ca3af;
    }

    .subtopic-chip.active {
      color: #111827;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.08);
      border-left: 3px solid #111827;
      padding-left: 12px;
    }

    /* ==========================================================================
       Main Content Area (Pure White Background, Borderless Flow)
       ========================================================================== */
    @keyframes studyContentFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .main-content {
      flex: 1;
      padding: 32px 44px;
      max-width: 1120px;
      margin: 0;
      overflow-y: visible;
      background-color: var(--bg-page);
    }

    .main-content.content-entering {
      animation: studyContentFadeIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Top Summary / Theory Banner (Minimalist Left-Border Box) */
    .unit-hero-card {
      background: var(--tool-bg);
      border: none;
      border-left: 3px solid var(--current-border);
      border-radius: 0;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: none;
    }

    .unit-hero-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }

    .unit-hero-title {
      font-family: var(--font-headline);
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.5px;
    }

    .unit-hero-badge {
      background: #ffffff;
      color: #374151;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 0;
    }

    .focused-topic-card {
      border-left-color: var(--btn-danger, #d9383a);
    }

    .topic-context-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .topic-context-pill {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--btn-danger, #d9383a);
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 3px 10px;
      border-radius: 0;
      font-family: var(--font-headline);
      letter-spacing: -0.3px;
    }

    .btn-reset-topic-view {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #4b5563;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 0;
      cursor: pointer;
      font-family: var(--font-body);
      transition: background-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s ease, border-color 0.2s ease;
    }

    .btn-reset-topic-view:hover {
      background: #f3f4f6;
      color: #111827;
      border-color: #9ca3af;
    }

    .unit-hero-summary {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 12px;
      line-height: 1.72;
    }

    .theory-drawer-toggle {
      background: var(--btn-dark);
      border: none;
      color: #ffffff;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      transition: background-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.18s ease;
    }

    .theory-drawer-toggle:hover {
      background: var(--btn-dark-hover);
    }

    .theory-drawer-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease, margin-top 0.24s ease;
      margin-top: 0;
      overflow: hidden;
    }

    .theory-drawer-wrapper.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 16px;
    }

    .theory-drawer-inner {
      min-height: 0;
      overflow: hidden;
    }

    .theory-body-container {
      padding: 18px 20px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 0;
      font-size: 15px;
      line-height: 1.75;
      color: #27272a;
    }

    .theory-body-container h3 {
      font-family: var(--font-headline);
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin: 18px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #e5e7eb;
    }

    .theory-body-container h3:first-child {
      margin-top: 0;
    }

    .theory-body-container p, .theory-body-container ul {
      margin-bottom: 10px;
    }

    .theory-body-container ul {
      padding-left: 20px;
    }

    .theory-body-container li {
      margin-bottom: 4px;
    }

    .theory-body-container table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13.5px;
      background: #ffffff;
    }

    .theory-body-container th, .theory-body-container td {
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      text-align: left;
    }

    .theory-body-container th {
      background: #f1f5f9;
      font-weight: 600;
      color: #334155;
    }

    .theory-body-container .formula-card {
      background: var(--tool-bg);
      border-left: 3px solid #111827;
      padding: 10px 14px;
      border-radius: 0;
      margin: 10px 0;
      font-weight: 600;
      color: #111827;
    }

    .theory-body-container .formula-card ul {
      margin: 4px 0 0 0;
      padding-left: 18px;
    }

    .theory-body-container .formula-card li {
      margin-bottom: 3px;
      font-weight: 500;
    }

    .theory-body-container blockquote.theory-quote {
      background: var(--tool-bg);
      border-left: 3px solid #6b7280;
      padding: 8px 12px;
      border-radius: 0;
      margin: 8px 0;
      color: #374151;
      font-weight: 500;
    }

    .theory-body-container hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 16px 0;
    }

    /* Search Results Banner */
    .search-status-bar {
      background: var(--tool-bg);
      border-left: 3px solid #111827;
      border-radius: 0;
      padding: 12px 18px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #111827;
      font-weight: 600;
    }

    .search-reset-link {
      color: #6b7280;
      cursor: pointer;
      text-decoration: underline;
      font-size: 13px;
    }

    .search-reset-link:hover {
      color: #111827;
    }

    /* Section Control Header */
    .questions-control-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #111827;
    }

    .questions-count-text {
      font-family: var(--font-headline);
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }

    .btn-toggle-all-answers {
      background: var(--btn-dark);
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 0;
      cursor: pointer;
      color: #ffffff;
      font-family: var(--font-body);
      transition: background-color 0.1s;
    }

    .btn-toggle-all-answers:hover {
      background: var(--btn-dark-hover);
    }

    /* ==========================================================================
       Question Card Styles (선 없는 간결한 CBT 레이아웃)
       ========================================================================== */
    .question-card {
      background: #ffffff;
      border: none;
      border-bottom: 1px solid #e5e7eb;
      border-radius: 0;
      padding: 24px 0 28px 0;
      margin-bottom: 0;
      box-shadow: none;
    }

    .question-card:first-child {
      padding-top: 8px;
    }

    .q-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .q-badge-group {
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .q-badge-group .meta-sep {
      color: #cbd5e1;
    }

    .q-badge-group strong {
      color: #374151;
      font-weight: 600;
    }

    .btn-toggle-answer {
      background: #f4f5f7;
      border: 1px solid #cbd5e1;
      color: #374151;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 0;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.1s;
    }

    .btn-toggle-answer:hover {
      background: #e5e7eb;
      color: #111827;
    }

    .q-prompt-text {
      font-family: var(--font-headline);
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      line-height: 1.5;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .q-passage-box {
      font-size: 15.5px;
      line-height: 1.75;
      color: #27272a;
      margin-bottom: 20px;
      background-color: var(--tool-bg);
      padding: 16px 20px;
      border-radius: 0;
      border: none;
      white-space: pre-line;
      word-break: keep-all;
    }

    .q-passage-box table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      background: #ffffff;

    /* Code Container - Flat & clean (index.html .code-container 1:1) */
    .q-code-container {

  </style>
</head>
<body>

  <!-- Top Header Navigation (Company Test 미니멀 CBT 헤더 1:1) -->
  <header class="study-header">
    <div class="header-left">
      <div class="header-logo">
        Company Test <span class="header-logo-badge">개념서 &amp; 기출해설</span>
      </div>

      <div class="mode-toggle-group">
        <button class="btn-mode-tab active" id="btnModeConcept" onclick="switchMode('concept')">
          단원별 개념서
        </button>
        <button class="btn-mode-tab" id="btnModeRound" onclick="switchMode('round')">
          연도별 기출 (2020~2026)
        </button>
      </div>
    </div>

    <div class="header-right">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="liveSearchInput" class="search-input" placeholder="키워드 검색 (포인터, 서브넷, 결합도)..." oninput="handleSearchInput()">
        <button class="search-clear-btn" id="btnSearchClear" onclick="clearSearch()">✕</button>
      </div>

      <button class="btn-action-tool" id="btnGlobalAnswerToggle" onclick="toggleAllAnswers()">
        👁️ 정답 전체 펼치기
      </button>

      <a href="index.html" class="btn-action-tool btn-action-cbt" title="CBT 시험 모드로 이동">
        CBT 시험 모드로 돌아가기
      </a>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="appSidebar">
      <!-- Injected by JavaScript based on active mode -->
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      <!-- Injected by JavaScript -->
    </main>
  </div>

  <!-- Data Scripts -->
  <script src="data/exam-index.js"></script>
  <script src="data/concept-data.js"></script>

  <script>
    // =========================================================================
    // Core State
    // =========================================================================
    const state = {
      mode: 'concept', // 'concept' | 'round'
      activeUnit: 1,
      activeRoundId: '2026_1',
      activeTopic: null,
      searchQuery: '',
      allAnswersExpanded: false,
      theoryExpanded: true
    };

    // Fast Lookup
    let questionsData = [];
    let unitsData = {};
    let roundsCatalog = [];

    // =========================================================================
    // Zero-Dependency Syntax Highlighter & Formatter
    // =========================================================================
    function formatCodeWithSyntax(rawCode, category) {
      if (rawCode === null || rawCode === undefined || rawCode === '') return '';
      const lines = String(rawCode).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      let html = '';
      let inBlockComment = false;

      lines.forEach((line, idx) => {
        const lineNum = idx + 1;
        const res = highlightSyntaxLine(line, category, inBlockComment);
        inBlockComment = res.inBlockComment;
        html += `<div class="code-line"><span class="code-line-num">${lineNum}</span><span class="code-line-content">${res.html || ' '}</span></div>`;
      });
      return html;
    }

    function highlightSyntax(rawLine, category) {
      return highlightSyntaxLine(rawLine, category, false).html;
    }

    function highlightSyntaxLine(rawLine, category, inBlockComment = false) {
      if (rawLine === null || rawLine === undefined) {
        return { html: '', inBlockComment: Boolean(inBlockComment) };
      }
      const rawStr = String(rawLine);
      const cat = (category || '').toLowerCase();
      const len = rawStr.length;
      let out = '';

      const esc = escapeHtml;
      let startIdx = 0;

      // Handle ongoing multi-line block comment
      if (inBlockComment) {
        const closeIdx = rawStr.indexOf('*/');
        if (closeIdx === -1) {
          return { html: `<span class="c-com">${esc(rawStr)}</span>`, inBlockComment: true };
        } else {
          out += `<span class="c-com">${esc(rawStr.slice(0, closeIdx + 2))}</span>`;
          startIdx = closeIdx + 2;
          inBlockComment = false;
          if (startIdx >= len) {
            return { html: out, inBlockComment: false };
          }
        }
      }

      let remaining = rawStr.slice(startIdx);

      // 1. C/C++ Preprocessor (#include, #define)
      if ((cat !== 'python' && cat !== 'py') && startIdx === 0 && /^\s*#(include|define)\b/.test(remaining)) {
        const match = remaining.match(/^(\s*)(#(?:include|define))(\s*)(<[^>]+>|"[^"]+")?(.*)$/);
        if (match) {
          out += esc(match[1]);
          out += `<span class="c-kw">${esc(match[2])}</span>`;
          out += esc(match[3]);
          if (match[4]) {
            out += `<span class="c-str">${esc(match[4])}</span>`;
          }
          if (match[5] && match[5].trim()) {
            remaining = match[5];
          } else {
            if (match[5]) out += esc(match[5]);
            return { html: out, inBlockComment: false };
          }
        }
      }

      // Token regex pattern:
      // 1: Comments (C/Java: //, Python: #, SQL: --)
      // 2: Block comment start /* ... */ or /* to end of line
      // 3: Strings ("..." or '...')
      // 4: Numbers (integers, floats, hex)
      // 5: Words (keywords, types, functions)
      let commentPattern = '\\/\\/.*';
      let blockCommentPattern = '\\/\\*[\\s\\S]*?\\*\\/|\\/\\*.*';
      if (cat === 'python' || cat === 'py') {
        commentPattern = '#.*';
        blockCommentPattern = '"""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'';
      } else if (cat === 'sql') {
        commentPattern = '--.*';
      }

      const tokenRegex = new RegExp(
        `(${commentPattern})|(${blockCommentPattern})|("(?:\\\\.|[^"\\\\])*"|'(?:\\\\.|[^'\\\\])*')|(\\b0x[0-9a-fA-F]+\\b|\\b\\d+(?:\\.\\d+)?\\b)|(\\b[a-zA-Z_][a-zA-Z0-9_]*\\b)`,
        'g'
      );

      const KEYWORDS = new Set([
        'int','float','double','char','void','struct','public','class','static','return',
        'if','else','while','for','do','switch','case','break','continue','default','import',
        'interface','extends','implements','new','try','catch','finally','throw','throws',
        'def','lambda','in','not','is','from','as','elif','None','self','super','this',
        'true','false','null','TRUE','FALSE','NULL',
        'sizeof','typedef','const','final','boolean','byte','short','long','unsigned','signed',
        'len','range','print','input','pass','yield','raise','except','with',
        'select','from','where','group','by','having','order','join','inner','left','right',
        'outer','on','insert','into','values','update','set','delete','create','alter','drop',
        'table','view','index','count','sum','avg','max','min','rank','dense_rank','over'
      ]);

      const TYPES = new Set([
        'String','Integer','Boolean','Double','Float','List','ArrayList','Map','HashMap','Scanner','System','Object',
        'Exception','Thread','Runnable'
      ]);

      let lastIdx = 0;
      let m;
      while ((m = tokenRegex.exec(remaining)) !== null) {
        if (m.index > lastIdx) {
          out += esc(remaining.slice(lastIdx, m.index));
        }
        lastIdx = tokenRegex.lastIndex;

        if (m[1]) {
          out += `<span class="c-com">${esc(m[1])}</span>`;
        } else if (m[2]) {
          out += `<span class="c-com">${esc(m[2])}</span>`;
          if (m[2].startsWith('/*') && !m[2].endsWith('*/')) {
            inBlockComment = true;
          }
        } else if (m[3]) {
          out += `<span class="c-str">${esc(m[3])}</span>`;
        } else if (m[4]) {
          out += `<span class="c-num">${esc(m[4])}</span>`;
        } else if (m[5]) {
          const word = m[5];
          const lower = word.toLowerCase();
          if (KEYWORDS.has(lower) || KEYWORDS.has(word)) {
            out += `<span class="c-kw">${esc(word)}</span>`;
          } else if (TYPES.has(word)) {
            out += `<span class="c-type">${esc(word)}</span>`;
          } else if (/^\s*\(/.test(remaining.slice(lastIdx))) {
            out += `<span class="c-fn">${esc(word)}</span>`;
          } else {
            out += esc(word);
          }
        }
      }

      if (lastIdx < remaining.length) {
        out += esc(remaining.slice(lastIdx));
      }

      return { html: out, inBlockComment };
    }

    // =========================================================================
    // Markdown to HTML Micro-Renderer
    // =========================================================================
    function parseMarkdownToHtml(md) {
      if (!md) return '';
      let html = md;
      
      // Syntax-highlight fenced code blocks first
      const codeBlocks = [];
      html = html.replace(/```([a-zA-Z0-9_-]*)[^\n\r]*\r?\n([\s\S]*?)```/g, (match, lang, code) => {
        const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
        codeBlocks.push(`<div class="q-code-container"><div class="q-code-header"><span>${(lang || 'CODE').toUpperCase()}</span><span>Source</span></div><pre class="q-code-block">${formatCodeWithSyntax(code.trim(), lang)}</pre></div>`);
        return placeholder;
      });

      // Extract and HTML-escape inline code (`...`) before italic/bold/blockquote processing
      // so C pointer syntax like `*p` or `p->val` is never corrupted by `*...*` or `>` rules
      const inlineCodes = [];
      html = html.replace(/`([^`]+)`/g, (match, code) => {
        const placeholder = `__INLINE_CODE_${inlineCodes.length}__`;
        inlineCodes.push(`<code>${escapeHtml(code)}</code>`);
        return placeholder;
      });

      // Horizontal rules
      html = html.replace(/^---\s*$/gim, '<hr>');

      // Headers
      html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // Bold
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      // Blockquotes & Formula Callout Cards (> ...)
      html = html.replace(/(?:^>\s?.*(?:\r?\n|$))+/gm, (quoteMatch) => {
        const lines = quoteMatch.trim().split(/\r?\n/).map(l => l.replace(/^>\s?/, '').trim());
        const isFormula = lines.some(l => l.includes('📐') || l.includes('공식') || l.includes('📌'));
        let innerHtml = '';
        let inList = false;
        lines.forEach(line => {
          if (line.startsWith('- ')) {
            if (!inList) { innerHtml += '<ul>'; inList = true; }
            innerHtml += `<li>${line.substring(2).trim()}</li>`;
          } else {
            if (inList) { innerHtml += '</ul>'; inList = false; }
            if (line) innerHtml += `<div>${line}</div>`;
          }
        });
        if (inList) innerHtml += '</ul>';
        if (isFormula) {
          return `<div class="formula-card">${innerHtml}</div>\n`;
        }
        return `<blockquote class="theory-quote">${innerHtml}</blockquote>\n`;
      });

      // Tables
      html = html.replace(/(?:^\|.*\|\r?\n)+/gm, (tableMatch) => {
        const lines = tableMatch.trim().split(/\r?\n/).filter(l => l.trim().length > 0);
        if (lines.length < 2) return tableMatch;
        
        let tHtml = '<table>';
        // Headers
        const headerCols = lines[0].split('|').map(s => s.trim()).filter((s, idx, arr) => idx > 0 && idx < arr.length - 1);
        tHtml += '<thead><tr>' + headerCols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';

        // Skip separator line at lines[1]
        for (let i = 2; i < lines.length; i++) {
          const rowCols = lines[i].split('|').map(s => s.trim()).filter((s, idx, arr) => idx > 0 && idx < arr.length - 1);
          tHtml += '<tr>' + rowCols.map(c => `<td>${c}</td>`).join('') + '</tr>';
        }
        tHtml += '</tbody></table>';
        return tHtml;
      });

      // Bullet lists
      html = html.replace(/^\s*-\s+(.*$)/gim, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>(\r?\n)?)+/gim, '<ul>$&</ul>');

      // Restore inline codes & code blocks using function replacers to prevent $ patterns from corrupting content
      inlineCodes.forEach((ic, idx) => {
        html = html.replace(`__INLINE_CODE_${idx}__`, () => ic);
      });
      codeBlocks.forEach((cb, idx) => {
        html = html.replace(`__CODE_BLOCK_${idx}__`, () => cb);
      });

      // Line breaks
      html = html.replace(/\n\n/g, '<p></p>');

      return html;
    }

    function escapeHtml(text) {
      if (text === null || text === undefined || text === '') return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================================
    // Initialization
    // =========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      if (window.CONCEPT_BOOK) {
        questionsData = window.CONCEPT_BOOK.questions || [];
        unitsData = window.CONCEPT_BOOK.units || {};
      }
      if (window.EXAM_CATALOG) {
        roundsCatalog = window.EXAM_CATALOG;
        if (roundsCatalog.length > 0) {
          state.activeRoundId = roundsCatalog[0].id;
        }
      }

      renderSidebar(true);
      renderContent();
    });

    // =========================================================================
    // Mode Switcher
    // =========================================================================
    function switchMode(newMode) {
      state.mode = newMode;
      state.activeTopic = null;
      state.searchQuery = '';
      document.getElementById('liveSearchInput').value = '';
      document.getElementById('btnSearchClear').style.display = 'none';

      document.getElementById('btnModeConcept').classList.toggle('active', newMode === 'concept');
      document.getElementById('btnModeRound').classList.toggle('active', newMode === 'round');

      renderSidebar(true);
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // Sidebar Renderer (DOM-preserving for smooth CSS accordion transitions)
    // =========================================================================
    function renderSidebar(forceRebuild = false) {
      const sidebar = document.getElementById('appSidebar');
      if (!sidebar) return;

      if (state.mode === 'concept') {
        const existingConceptTree = sidebar.querySelector('[data-sidebar-mode="concept"]');
        if (existingConceptTree && !forceRebuild) {
          updateConceptSidebarActiveStates(sidebar);
          return;
        }

        let html = `<div data-sidebar-mode="concept"><div class="sidebar-section-title">단원별 개념</div><ul class="sidebar-list">`;
        
        for (let u = 1; u <= 5; u++) {
          const unit = unitsData[u] || {};
          const unitQuestions = questionsData.filter(q => q.unit === u);
          const count = unitQuestions.length;
          const isActive = state.activeUnit === u && !state.searchQuery;

          const topicsMap = {};
          unitQuestions.forEach(q => {
            if (q.topic) topicsMap[q.topic] = (topicsMap[q.topic] || 0) + 1;
          });

          html += `
            <li class="sidebar-unit-item" data-unit-item="${u}">
              <button class="sidebar-item-btn ${isActive ? 'active' : ''}" data-unit="${u}" onclick="selectUnit(Number(this.dataset.unit))">
                <span class="sidebar-item-label">${unit.shortTitle || `제${u}단원`}</span>
                <span class="sidebar-item-right">
                  <span class="sidebar-badge">${count}제</span>
                  <span class="unit-chevron">▸</span>
                </span>
              </button>
              <div class="sidebar-subtopics-wrapper ${isActive ? 'open' : ''}" data-subtopics-for="${u}">
                <div class="sidebar-subtopics-inner">
                  <div class="sidebar-subtopics">
                    <button class="subtopic-chip ${isActive && !state.activeTopic ? 'active' : ''}" data-unit-owner="${u}" data-topic="" onclick="selectTopic(null, Number(this.dataset.unitOwner))">전체 보기 (${unitQuestions.length})</button>
          `;

          const syllabus = (window.CONCEPT_BOOK && window.CONCEPT_BOOK.syllabus && window.CONCEPT_BOOK.syllabus[u]) || (unit.syllabus || []);
          const sortedTopics = Object.keys(topicsMap).sort((a, b) => {
            const idxA = syllabus.indexOf(a);
            const idxB = syllabus.indexOf(b);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.localeCompare(b, 'ko');
          });

          for (const topic of sortedTopics) {
            const tCount = topicsMap[topic];
            const isTopicActive = isActive && (state.activeTopic === topic);
            html += `<button class="subtopic-chip ${isTopicActive ? 'active' : ''}" data-unit-owner="${u}" data-topic="${escapeHtml(topic)}" onclick="selectTopic(this.dataset.topic, Number(this.dataset.unitOwner))">• ${escapeHtml(topic)} (${tCount})</button>`;
          }

          html += `
                  </div>
                </div>
              </div>
            </li>
          `;
        }
        html += `</ul></div>`;
        sidebar.innerHTML = html;

      } else {
        // Round Mode
        const existingRoundTree = sidebar.querySelector('[data-sidebar-mode="round"]');
        if (existingRoundTree && !forceRebuild) {
          updateRoundSidebarActiveStates(sidebar);
          return;
        }

        let html = `<div data-sidebar-mode="round"><div class="sidebar-section-title">연도별 기출 회차</div><ul class="sidebar-list">`;
        
        const standardRounds = roundsCatalog.filter(r => !r.id.startsWith('killer_') && !r.id.startsWith('sql_') && !r.id.startsWith('practical_') && !r.id.startsWith('c_') && !r.id.startsWith('java_') && !r.id.startsWith('python_'));
        const themeRounds = roundsCatalog.filter(r => !standardRounds.includes(r));

        standardRounds.forEach(r => {
          const isActive = state.activeRoundId === r.id && !state.searchQuery;
          html += `
            <li>
              <button class="sidebar-item-btn ${isActive ? 'active' : ''}" data-round-id="${escapeHtml(r.id)}" onclick="selectRound(this.dataset.roundId)">
                <span class="sidebar-item-label">${r.title}</span>
                <span class="sidebar-badge">${r.questionCount}문항</span>
              </button>
            </li>
          `;
        });

        html += `</ul><div class="sidebar-section-title">주제별 기출 모음</div><ul class="sidebar-list">`;

        themeRounds.forEach(r => {
          const isActive = state.activeRoundId === r.id && !state.searchQuery;
          html += `
            <li>
              <button class="sidebar-item-btn ${isActive ? 'active' : ''}" data-round-id="${escapeHtml(r.id)}" onclick="selectRound(this.dataset.roundId)">
                <span class="sidebar-item-label">${r.title}</span>
                <span class="sidebar-badge">${r.questionCount}문항</span>
              </button>
            </li>
          `;
        });

        html += `</ul></div>`;
        sidebar.innerHTML = html;
      }
    }

    function updateConceptSidebarActiveStates(sidebar) {
      const isSearching = Boolean(state.searchQuery && state.searchQuery.trim());
      const unitBtns = sidebar.querySelectorAll('.sidebar-item-btn[data-unit]');
      unitBtns.forEach(btn => {
        const u = Number(btn.dataset.unit);
        const isActive = (u === state.activeUnit) && !isSearching;
        btn.classList.toggle('active', isActive);
      });

      const wrappers = sidebar.querySelectorAll('.sidebar-subtopics-wrapper[data-subtopics-for]');
      wrappers.forEach(w => {
        const u = Number(w.dataset.subtopicsFor);
        const isOpen = (u === state.activeUnit) && !isSearching;
        w.classList.toggle('open', isOpen);
      });

      const chips = sidebar.querySelectorAll('.subtopic-chip[data-unit-owner]');
      chips.forEach(chip => {
        const u = Number(chip.dataset.unitOwner);
        const topic = chip.dataset.topic || null;
        const isUnitActive = (u === state.activeUnit) && !isSearching;
        const isChipActive = isUnitActive && (
          (topic === null && !state.activeTopic) ||
          (topic !== null && state.activeTopic === topic)
        );
        chip.classList.toggle('active', isChipActive);
      });
    }

    function updateRoundSidebarActiveStates(sidebar) {
      const isSearching = Boolean(state.searchQuery && state.searchQuery.trim());
      const roundBtns = sidebar.querySelectorAll('.sidebar-item-btn[data-round-id]');
      roundBtns.forEach(btn => {
        const rid = btn.dataset.roundId;
        btn.classList.toggle('active', rid === state.activeRoundId && !isSearching);
      });
    }

    function selectUnit(u) {
      state.activeUnit = u;
      state.activeTopic = null;
      state.searchQuery = '';
      document.getElementById('liveSearchInput').value = '';
      document.getElementById('btnSearchClear').style.display = 'none';
      renderSidebar();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectTopic(t, unitOwner) {
      state.searchQuery = '';
      const sInput = document.getElementById('liveSearchInput');
      if (sInput) sInput.value = '';
      const cBtn = document.getElementById('btnSearchClear');
      if (cBtn) cBtn.style.display = 'none';

      if (t && t !== 'null' && t !== 'undefined') {
        let targetUnit = unitOwner;
        if (!targetUnit) {
          const m = String(t).match(/^(\d+)\./);
          if (m) {
            targetUnit = Number(m[1]);
          } else {
            const anyMatch = questionsData.find(q => q.topic === t || (q.topic && q.topic.includes(t)) || (q.topic && t.includes(q.topic)));
            if (anyMatch) targetUnit = anyMatch.unit;
          }
        }
        if (targetUnit && targetUnit >= 1 && targetUnit <= 5) {
          state.activeUnit = targetUnit;
        }

        const unitQuestions = questionsData.filter(q => q.unit === state.activeUnit);
        const syllabus = (window.CONCEPT_BOOK && window.CONCEPT_BOOK.syllabus && window.CONCEPT_BOOK.syllabus[state.activeUnit]) || [];
        const sylMatch = syllabus.find(s => s === t || s.startsWith(t) || s.includes(t) || t.includes(s));
        const qMatch = unitQuestions.find(q => q.topic === t || (q.topic && q.topic.includes(t)) || (q.topic && t.includes(q.topic)));

        state.activeTopic = sylMatch || (qMatch ? qMatch.topic : t);
        state.theoryExpanded = true;
      } else {
        if (unitOwner && unitOwner >= 1 && unitOwner <= 5) {
          state.activeUnit = unitOwner;
        }
        state.activeTopic = null;
      }
      renderSidebar();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectRound(rid) {
      state.activeRoundId = rid;
      state.searchQuery = '';
      document.getElementById('liveSearchInput').value = '';
      document.getElementById('btnSearchClear').style.display = 'none';
      renderSidebar();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // Content Renderer
    // =========================================================================
    function triggerContentTransition(container) {
      if (!container) return;
      container.classList.remove('content-entering');
      void container.offsetWidth;
      container.classList.add('content-entering');
    }

    function renderContent() {
      const container = document.getElementById('mainContent');
      if (!container) return;

      // Case 1: Search Active
      if (state.searchQuery.trim().length > 0) {
        renderSearchResults(container);
        return;
      }

      // Case 2: Concept Mode
      if (state.mode === 'concept') {
        renderConceptMode(container);
        triggerContentTransition(container);
        return;
      }

      // Case 3: Round Mode
      renderRoundMode(container);
      triggerContentTransition(container);
    }

    function renderConceptMode(container) {
      const unit = unitsData[state.activeUnit] || {};
      let qs = questionsData.filter(q => q.unit === state.activeUnit);
      if (state.activeTopic) {
        qs = qs.filter(q => q.topic === state.activeTopic);
      }

      const isTopicFocused = Boolean(state.activeTopic);
      let theoryHtml = '';
      if (isTopicFocused && unit.sections && unit.sections[state.activeTopic]) {
        theoryHtml = parseMarkdownToHtml(unit.sections[state.activeTopic]);
      } else if (isTopicFocused) {
        const fullMd = unit.markdown || '';
        const topicNum = (state.activeTopic.match(/^(\d+\.\d+)/) || [])[1];
        const regex = new RegExp(`(### 📌 ${topicNum ? escapeRegex(topicNum) : escapeRegex(state.activeTopic)}[\\s\\S]*?)(?=(?:### 📌 |$))`, 'i');
        const match = fullMd.match(regex);
        theoryHtml = match ? parseMarkdownToHtml(match[1]) : parseMarkdownToHtml(fullMd);
      } else {
        theoryHtml = parseMarkdownToHtml(unit.markdown || '');
      }

      let html = '';

      // Hero Card (Theory Summary)
      html += `
        <div class="unit-hero-card ${isTopicFocused ? 'focused-topic-card' : ''}">
          <div class="unit-hero-header">
            <div>
              <h1 class="unit-hero-title">${unit.title || `제${state.activeUnit}단원`}</h1>
              ${isTopicFocused ? `
                <div class="topic-context-banner">
                  <span class="topic-context-pill">[${escapeHtml(state.activeTopic)} 핵심 요약]</span>
                  <button class="btn-reset-topic-view" onclick="selectTopic(null)">단원 전체 이론 보기 ↺</button>
                </div>
              ` : ''}
            </div>
            <span class="unit-hero-badge">기출 총 ${questionsData.filter(q => q.unit === state.activeUnit).length}문항 수록</span>
          </div>
          <p class="unit-hero-summary">${unit.summary || ''}</p>
          <button class="theory-drawer-toggle" onclick="toggleTheoryDrawer()">
            <span>${state.theoryExpanded ? '이론 요약 접기 ▲' : '이론 요약 펼치기 ▼'}</span>
          </button>
          <div class="theory-drawer-wrapper ${state.theoryExpanded ? 'open' : ''}" id="theoryDrawerWrapper">
            <div class="theory-drawer-inner">
              <div class="theory-body-container" id="theoryBodyContainer">
                ${theoryHtml}
              </div>
            </div>
          </div>
        </div>
      `;

      // Question Controls
      html += `
        <div class="questions-control-header">
          <span class="questions-count-text">
            관련 기출문제 ${state.activeTopic ? `[${escapeHtml(state.activeTopic)}]` : ''} — 총 ${qs.length}문항
          </span>
          <button class="btn-toggle-all-answers" onclick="toggleAllAnswers()">
            ${state.allAnswersExpanded ? '전체 정답 접기 ▲' : '전체 정답 펼치기 ▼'}
          </button>
        </div>
      `;

      // Render Questions
      html += renderQuestionsList(qs);
      container.innerHTML = html;
    }

    function renderRoundMode(container) {
      const roundMeta = roundsCatalog.find(r => r.id === state.activeRoundId) || {};
      const qs = questionsData.filter(q => q.round_id === state.activeRoundId);

      let html = '';
      html += `
        <div class="unit-hero-card">
          <div class="unit-hero-header">
            <h1 class="unit-hero-title">${roundMeta.title || state.activeRoundId}</h1>
            <span class="unit-hero-badge">합격률: ${roundMeta.passRate || '-'} | 난이도: ${roundMeta.difficulty || '-'}</span>
          </div>
          <p class="unit-hero-summary">${roundMeta.description || ''}</p>
        </div>
        <div class="questions-control-header">
          <span class="questions-count-text">
            회차 전체 문항 — 총 ${qs.length}문항
          </span>
          <button class="btn-toggle-all-answers" onclick="toggleAllAnswers()">
            ${state.allAnswersExpanded ? '전체 정답 접기 ▲' : '전체 정답 펼치기 ▼'}
          </button>
        </div>
      `;

      html += renderQuestionsList(qs);
      container.innerHTML = html;
    }

    function renderSearchResults(container) {
      const q = state.searchQuery.toLowerCase().trim();
      const results = questionsData.filter(item => {
        const text = `${item.prompt} ${item.answer} ${item.explanation} ${item.category} ${item.topic} ${item.code || ''} ${item.passage || ''} ${item.trapPoint || ''} ${item.round_title}`.toLowerCase();
        return text.includes(q);
      });

      let html = `
        <div class="search-status-bar">
          <span>🔍 '<strong>${escapeHtml(state.searchQuery)}</strong>' 검색 결과: 총 <strong>${results.length}</strong>개 문항 발견</span>
          <span class="search-reset-link" onclick="clearSearch()">검색 닫기 ✕</span>
        </div>
        <div class="questions-control-header">
          <span class="questions-count-text">검색 일치 문항 목록</span>
          <button class="btn-toggle-all-answers" onclick="toggleAllAnswers()">
            ${state.allAnswersExpanded ? '전체 정답 접기 ▲' : '전체 정답 펼치기 ▼'}
          </button>
        </div>
      `;

      if (results.length === 0) {
        html += `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <div class="empty-state-title">검색된 문제가 없습니다</div>
            <p>다른 검색어를 입력하시거나 철자를 확인해 주세요 (예: 포인터, 서브넷, 결합도, 정규화, ACID).</p>
          </div>
        `;
      } else {
        html += renderQuestionsList(results, true);
      }

      container.innerHTML = html;
    }

    function renderQuestionsList(qs, isSearch = false) {
      let html = '';
      qs.forEach((q, idx) => {
        const uid = q.uid || `${q.round_id}_${q.id}`;
        const isExpanded = state.allAnswersExpanded;

        html += `
          <div class="question-card" id="card_${uid}">
            <div class="q-meta-row">
              <div class="q-badge-group">
                <span><strong>${highlightQuery(q.round_title, isSearch)}</strong> (문항 ${q.id})</span>
                <span class="meta-sep">|</span>
                <span>${highlightQuery(q.category, isSearch)}</span>
                ${q.topic ? `<span class="meta-sep">|</span><span>${highlightQuery(q.topic, isSearch)}</span>` : ''}
              </div>
              <button class="btn-toggle-answer" id="btn_toggle_${uid}" onclick="toggleSingleAnswer('${uid}')">
                ${isExpanded ? '정답 접기 ▲' : '정답 &amp; 해설 보기 ▼'}
              </button>
            </div>

            <div class="q-prompt-text">${highlightQuery(q.prompt, isSearch)}</div>

            ${q.passage ? `<div class="q-passage-box">${highlightQuery(q.passage, isSearch)}</div>` : ''}

            ${q.code ? `
              <div class="q-code-container">
                <div class="q-code-header">
                  <span>${(q.category || 'CODE').toUpperCase()}</span>
                  <span>Source Code</span>
                </div>
                <pre class="q-code-block">${formatCodeWithSyntax(q.code, q.category)}</pre>
              </div>
            ` : ''}

            <div class="q-solution-drawer" id="drawer_${uid}" style="display: ${isExpanded ? 'block' : 'none'};">
              <div class="q-answer-card">
                <div><span class="exp-correct-label">🔑 모범 정답:</span> <code>${highlightQuery(q.answer, isSearch)}</code></div>
                ${q.aliases && q.aliases.length > 1 ? `
                  <div class="q-aliases-text">인정 유사 답안: ${q.aliases.filter(a => a !== q.answer).map(a => `<code>${escapeHtml(a)}</code>`).join(', ')}</div>
                ` : ''}
              </div>

              ${q.trapPoint ? `
                <div class="q-trap-box">
                  <div class="q-trap-title">주의 포인트</div>
                  <div>${highlightQuery(q.trapPoint, isSearch)}</div>
                </div>
              ` : ''}

              ${renderTraceTableHtml(q.traceTable)}

              <div class="q-exp-text"><strong>📖 [상세 해설]</strong>\n${highlightQuery(q.explanation, isSearch)}</div>
            </div>
          </div>
        `;
      });
      return html;
    }

    function renderTraceTableHtml(trace) {
      if (!trace || !trace.headers || !trace.rows) return '';
      let html = `
        <div class="q-trace-box">
          <div class="q-trace-title">🔍 루프 변수 추적표 (Trace Table)</div>
          <table class="q-trace-table">
            <thead>
              <tr>${trace.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${trace.rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(String(c))}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
      return html;
    }

    function highlightQuery(text, isSearch) {
      if (text === null || text === undefined || text === '') return '';
      if (!isSearch || !state.searchQuery.trim()) return escapeHtml(text);
      const q = state.searchQuery.trim();
      const regex = new RegExp(`(${escapeRegex(q)})`, 'gi');
      const parts = String(text).split(regex);
      const qLower = q.toLowerCase();
      return parts.map(part => {
        if (part.toLowerCase() === qLower) {
          return `<mark class="highlight">${escapeHtml(part)}</mark>`;
        }
        return escapeHtml(part);
      }).join('');
    }

    function escapeRegex(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // =========================================================================
    // UI Event Handlers
    // =========================================================================
    function toggleTheoryDrawer() {
      state.theoryExpanded = !state.theoryExpanded;
      const wrapper = document.getElementById('theoryDrawerWrapper');
      if (wrapper) wrapper.classList.toggle('open', state.theoryExpanded);
      const btn = document.querySelector('.theory-drawer-toggle span');
      if (btn) btn.textContent = state.theoryExpanded ? '이론 요약 접기 ▲' : '이론 요약 펼치기 ▼';
    }

    function toggleSingleAnswer(uid) {
      const drawer = document.getElementById(`drawer_${uid}`);
      const btn = document.getElementById(`btn_toggle_${uid}`);
      if (!drawer || !btn) return;
      const isOpen = drawer.style.display !== 'none';
      drawer.style.display = isOpen ? 'none' : 'block';
      btn.textContent = isOpen ? '정답 & 해설 보기 ▼' : '정답 접기 ▲';
    }

    function toggleAllAnswers() {
      state.allAnswersExpanded = !state.allAnswersExpanded;
      const drawers = document.querySelectorAll('.q-solution-drawer');
      const buttons = document.querySelectorAll('.btn-toggle-answer');
      drawers.forEach(d => d.style.display = state.allAnswersExpanded ? 'block' : 'none');
      buttons.forEach(b => b.textContent = state.allAnswersExpanded ? '정답 접기 ▲' : '정답 & 해설 보기 ▼');
      
      const gBtn = document.getElementById('btnGlobalAnswerToggle');
      if (gBtn) gBtn.textContent = state.allAnswersExpanded ? '🙈 정답 전체 접기' : '👁️ 정답 전체 펼치기';
      const cBtns = document.querySelectorAll('.btn-toggle-all-answers');
      cBtns.forEach(cb => cb.textContent = state.allAnswersExpanded ? '전체 정답 접기 ▲' : '전체 정답 펼치기 ▼');
    }

    function handleSearchInput() {
      const val = document.getElementById('liveSearchInput').value;
      state.searchQuery = val;
      const clearBtn = document.getElementById('btnSearchClear');
      clearBtn.style.display = val.length > 0 ? 'inline-block' : 'none';
      renderSidebar();
      renderContent();
    }

    function clearSearch() {
      state.searchQuery = '';
      document.getElementById('liveSearchInput').value = '';
      document.getElementById('btnSearchClear').style.display = 'none';
      renderSidebar();
      renderContent();
    }
  </script>
</body>
</html>
